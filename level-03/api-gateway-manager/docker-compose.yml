version: '3.8'
services:
  kong-database:
    image: postgres:13
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 5s
      retries: 10

  kong:
    image: kong:3.3
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
      KONG_CASSANDRA_CONTACT_POINTS: kong-database
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"   # proxy
      - "8443:8443"   # proxy SSL
      - "8001:8001"   # admin
      - "8444:8444"   # admin SSL
    healthcheck:
      test: ["CMD", "kong", "healthcheck", "--readiness"]
      interval: 5s
      retries: 10

  sample-upstream:
    build:
      context: .
      dockerfile: Dockerfile.sample
    image: api-gateway-sample-upstream
    ports:
      - "5000:5000"

  # Optional: a small management container waits for DB then runs kong migrations
  kong-migrations:
    image: kong:3.3
    depends_on:
      - kong-database
    entrypoint: sh -c "kong migrations bootstrap && sleep 2"
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: kong-database
      KONG_PG_PASSWORD: kong
