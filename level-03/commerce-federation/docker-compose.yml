version: '3'

services:
  gateway:
    build: ./gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PRODUCTS_URL=http://products:4001
      - USERS_URL=http://users:4002
      - ORDERS_URL=http://orders:4003
      - REVIEWS_URL=http://reviews:4004
    depends_on:
      - products
      - users
      - orders
      - reviews

  products:
    build: ./services/products
    ports:
      - "4001:4001"
    environment:
      - PORT=4001

  users:
    build: ./services/users
    ports:
      - "4002:4002"
    environment:
      - PORT=4002

  orders:
    build: ./services/orders
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - PRODUCTS_URL=http://products:4001
      - USERS_URL=http://users:4002

  reviews:
    build: ./services/reviews
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - PRODUCTS_URL=http://products:4001
      - USERS_URL=http://users:4002
