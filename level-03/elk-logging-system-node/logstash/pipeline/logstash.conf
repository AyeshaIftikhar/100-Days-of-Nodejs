# Accept NDJSON over HTTP
input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json_lines
  }
}

filter {
  # Enrich logs with host/container info if available
  mutate {
    add_field => {
      "ingest.ts" => "%{@timestamp}"
      "ingest.node" => "logstash-01"
    }
  }

  # Normalize common fields
  if ![service] and [name] {
    mutate { add_field => { "service" => "%{[name]}" } }
  }
  if ![environment] and [env] {
    mutate { add_field => { "environment" => "%{[env]}" } }
  }

  # Example: flatten nested error object (if present)
  if [error][message] {
    mutate {
      add_field => { "error.message" => "%{[error][message]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => [ "http://elasticsearch:9200" ]
    index => "logs-node-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }

  # Optional: stdout for debugging
  stdout { codec => rubydebug }
}
