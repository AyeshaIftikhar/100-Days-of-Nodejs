<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Code API Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding-top: 2rem;
    }
    .api-card {
      margin-bottom: 1.5rem;
      transition: transform 0.3s;
    }
    .api-card:hover {
      transform: translateY(-5px);
    }
    #loginSection, #registerSection {
      max-width: 500px;
      margin: 0 auto;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4 text-center">Low-Code API Builder</h1>
    
    <!-- Auth Sections -->
    <div id="authContainer">
      <div id="loginSection">
        <div class="card">
          <div class="card-header">
            <h3>Login</h3>
          </div>
          <div class="card-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required>
              </div>
              <button type="submit" class="btn btn-primary">Login</button>
              <button type="button" id="showRegister" class="btn btn-link">New user? Register here</button>
            </form>
          </div>
        </div>
      </div>
      
      <div id="registerSection" class="hidden">
        <div class="card">
          <div class="card-header">
            <h3>Register</h3>
          </div>
          <div class="card-body">
            <form id="registerForm">
              <div class="mb-3">
                <label for="registerUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="registerUsername" required>
              </div>
              <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="registerEmail" required>
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="registerPassword" required minlength="6">
              </div>
              <button type="submit" class="btn btn-success">Register</button>
              <button type="button" id="showLogin" class="btn btn-link">Already registered? Login here</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Main App Section -->
    <div id="appContainer" class="hidden">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Your APIs</h2>
        <div>
          <button id="createApiBtn" class="btn btn-primary">Create New API</button>
          <button id="logoutBtn" class="btn btn-outline-danger ms-2">Logout</button>
        </div>
      </div>
      
      <div id="apiList" class="row">
        <!-- API cards will be rendered here -->
        <div class="col-12 text-center">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
      
      <!-- API Form Modal -->
      <div class="modal fade" id="apiFormModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="apiFormTitle">Create New API</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="apiForm">
                <input type="hidden" id="apiId">
                
                <div class="mb-3">
                  <label for="apiName" class="form-label">API Name</label>
                  <input type="text" class="form-control" id="apiName" required>
                  <div class="form-text">This will be used in the URL: /api/v1/{name}</div>
                </div>
                
                <div class="mb-3">
                  <label for="apiDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="apiDescription" rows="2"></textarea>
                </div>
                
                <div class="mb-3">
                  <label for="apiBaseUrl" class="form-label">Base URL</label>
                  <input type="text" class="form-control" id="apiBaseUrl" required>
                  <div class="form-text">Example: /users</div>
                </div>
                
                <h5 class="mt-4">Data Model</h5>
                <div id="fieldsContainer">
                  <!-- Field rows will be added here -->
                </div>
                <button type="button" id="addFieldBtn" class="btn btn-sm btn-outline-primary mt-2">Add Field</button>
                
                <h5 class="mt-4">Endpoints</h5>
                <div id="endpointsContainer">
                  <!-- Endpoint rows will be added here -->
                </div>
                <button type="button" id="addEndpointBtn" class="btn btn-sm btn-outline-primary mt-2">Add Endpoint</button>
                
                <div class="form-check mt-4">
                  <input class="form-check-input" type="checkbox" id="publishApi">
                  <label class="form-check-label" for="publishApi">
                    Publish API
                  </label>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" id="saveApiBtn" class="btn btn-primary">Save API</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // This is a simplified frontend for demonstration purposes
    // In a real application, you would have more comprehensive client-side code
    
    // DOM Elements
    const loginSection = document.getElementById('loginSection');
    const registerSection = document.getElementById('registerSection');
    const authContainer = document.getElementById('authContainer');
    const appContainer = document.getElementById('appContainer');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const apiList = document.getElementById('apiList');
    const logoutBtn = document.getElementById('logoutBtn');
    const createApiBtn = document.getElementById('createApiBtn');
    
    // Show the appropriate section based on auth status
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (token) {
        authContainer.classList.add('hidden');
        appContainer.classList.remove('hidden');
        fetchApis();
      } else {
        authContainer.classList.remove('hidden');
        appContainer.classList.add('hidden');
        loginSection.classList.remove('hidden');
        registerSection.classList.add('hidden');
      }
    }
    
    // Initial auth check
    checkAuth();
    
    // Toggle between login and register forms
    document.getElementById('showRegister').addEventListener('click', () => {
      loginSection.classList.add('hidden');
      registerSection.classList.remove('hidden');
    });
    
    document.getElementById('showLogin').addEventListener('click', () => {
      registerSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
    });
    
    // Handle login form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const response = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('token', data.token);
          checkAuth();
        } else {
          alert('Login failed: ' + data.error);
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('An error occurred during login');
      }
    });
    
    // Handle register form submission
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('registerUsername').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      
      try {
        const response = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, email, password }),
        });
        
        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('token', data.token);
          checkAuth();
        } else {
          alert('Registration failed: ' + data.error);
        }
      } catch (error) {
        console.error('Registration error:', error);
        alert('An error occurred during registration');
      }
    });
    
    // Handle logout
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      checkAuth();
    });
    
    // Fetch APIs for the current user
    async function fetchApis() {
      try {
        const token = localStorage.getItem('token');
        
        const response = await fetch('/api/v1/apis?includeUnpublished=true', {
          headers: {
            'Authorization': `Bearer ${token}`,
          },
        });
        
        const data = await response.json();
        
        if (data.success) {
          renderApiList(data.data);
        } else {
          apiList.innerHTML = `<div class="col-12"><div class="alert alert-danger">${data.error}</div></div>`;
        }
      } catch (error) {
        console.error('Fetch APIs error:', error);
        apiList.innerHTML = `<div class="col-12"><div class="alert alert-danger">Failed to load APIs</div></div>`;
      }
    }
    
    // Render the list of APIs
    function renderApiList(apis) {
      if (apis.length === 0) {
        apiList.innerHTML = `
          <div class="col-12">
            <div class="alert alert-info">
              You haven't created any APIs yet. Click "Create New API" to get started.
            </div>
          </div>
        `;
        return;
      }
      
      apiList.innerHTML = apis.map(api => `
        <div class="col-md-4">
          <div class="card api-card ${api.published ? 'border-success' : 'border-warning'}">
            <div class="card-header d-flex justify-content-between">
              <h5 class="mb-0">${api.name}</h5>
              <span class="badge bg-${api.published ? 'success' : 'warning'}">
                ${api.published ? 'Published' : 'Draft'}
              </span>
            </div>
            <div class="card-body">
              <p>${api.description || 'No description'}</p>
              <p><small>Base URL: ${api.baseUrl}</small></p>
              <p><small>Fields: ${api.fields.length}</small></p>
              <p><small>Endpoints: ${api.endpoints.length}</small></p>
            </div>
            <div class="card-footer d-flex justify-content-between">
              <button class="btn btn-sm btn-outline-primary edit-api" data-id="${api._id}">Edit</button>
              <button class="btn btn-sm btn-${api.published ? 'warning' : 'success'} publish-api" data-id="${api._id}">
                ${api.published ? 'Unpublish' : 'Publish'}
              </button>
              <button class="btn btn-sm btn-danger delete-api" data-id="${api._id}">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
      
      // Add event listeners for API actions
      document.querySelectorAll('.edit-api').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const apiId = e.target.getAttribute('data-id');
          // Implement edit functionality
          console.log('Edit API:', apiId);
        });
      });
      
      document.querySelectorAll('.publish-api').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const apiId = e.target.getAttribute('data-id');
          try {
            const token = localStorage.getItem('token');
            
            const response = await fetch(`/api/v1/apis/${apiId}/publish`, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${token}`,
              },
            });
            
            const data = await response.json();
            
            if (data.success) {
              fetchApis(); // Refresh the list
            } else {
              alert('Failed to update publish status: ' + data.error);
            }
          } catch (error) {
            console.error('Publish API error:', error);
            alert('An error occurred while updating publish status');
          }
        });
      });
      
      document.querySelectorAll('.delete-api').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('Are you sure you want to delete this API? This action cannot be undone.')) {
            return;
          }
          
          const apiId = e.target.getAttribute('data-id');
          try {
            const token = localStorage.getItem('token');
            
            const response = await fetch(`/api/v1/apis/${apiId}`, {
              method: 'DELETE',
              headers: {
                'Authorization': `Bearer ${token}`,
              },
            });
            
            const data = await response.json();
            
            if (data.success) {
              fetchApis(); // Refresh the list
            } else {
              alert('Failed to delete API: ' + data.error);
            }
          } catch (error) {
            console.error('Delete API error:', error);
            alert('An error occurred while deleting the API');
          }
        });
      });
    }
    
    // TODO: Implement API form functionality (create/edit)
    createApiBtn.addEventListener('click', () => {
      // Show API form modal
      const modal = new bootstrap.Modal(document.getElementById('apiFormModal'));
      modal.show();
    });
  </script>
</body>
</html>
