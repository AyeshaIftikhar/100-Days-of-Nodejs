version: "3.8"
services:
  redis:
    image: redis:7
    container_name: dcs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: dcs-app
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - QUEUE_PREFIX=dcq
    depends_on:
      - redis
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
    command: npm run dev

  worker:
    build: .
    container_name: dcs-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_PREFIX=dcq
    depends_on:
      - redis
    volumes:
      - ./:/usr/src/app
    command: npm run worker

volumes:
  redis_data:
