<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAssembly Image Processing API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .image-container {
      max-width: 100%;
      margin-top: 20px;
    }
    .image-container img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }
    .operations-container {
      margin-top: 20px;
    }
    .operation-card {
      margin-bottom: 15px;
    }
    .results-container {
      margin-top: 30px;
    }
    .spinner-border {
      display: none;
    }
    .loading .spinner-border {
      display: inline-block;
    }
    .benchmark {
      margin-top: 20px;
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">WebAssembly Image Processing API</h1>
    
    <div class="d-flex justify-content-end mb-3">
      <a href="/benchmark.html" class="btn btn-outline-primary">Run Performance Benchmark</a>
    </div>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5>Upload an Image</h5>
          </div>
          <div class="card-body">
            <form id="uploadForm" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="imageInput" class="form-label">Select Image</label>
                <input class="form-control" type="file" id="imageInput" accept="image/*" required>
              </div>
              
              <div class="mb-3">
                <label for="operationSelect" class="form-label">Select Operation</label>
                <select class="form-control" id="operationSelect" required>
                  <option value="">Choose an operation...</option>
                </select>
              </div>
              
              <div id="paramsContainer" class="mb-3">
                <!-- Dynamic parameters will be added here -->
              </div>
              
              <button type="submit" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Process Image
              </button>
            </form>
          </div>
        </div>
        
        <div class="benchmark card mt-4" id="benchmarkCard" style="display: none;">
          <div class="card-header">
            <h5>Performance Benchmark</h5>
          </div>
          <div class="card-body">
            <div id="benchmarkResults"></div>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="results-container" id="resultsContainer" style="display: none;">
          <h4>Results</h4>
          
          <div class="row">
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">Original</div>
                <div class="card-body text-center">
                  <div class="image-container">
                    <img id="originalImage" src="" alt="Original Image">
                  </div>
                </div>
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="card">
                <div class="card-header">Processed</div>
                <div class="card-body text-center">
                  <div class="image-container">
                    <img id="processedImage" src="" alt="Processed Image">
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="mt-3">
            <h5>API Response</h5>
            <pre id="responseJson" class="bg-light p-3 rounded"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const uploadForm = document.getElementById('uploadForm');
      const operationSelect = document.getElementById('operationSelect');
      const paramsContainer = document.getElementById('paramsContainer');
      const resultsContainer = document.getElementById('resultsContainer');
      const originalImage = document.getElementById('originalImage');
      const processedImage = document.getElementById('processedImage');
      const responseJson = document.getElementById('responseJson');
      const benchmarkCard = document.getElementById('benchmarkCard');
      const benchmarkResults = document.getElementById('benchmarkResults');
      
      let operations = [];
      
      // Fetch available operations
      async function fetchOperations() {
        try {
          const response = await fetch('/api/images/operations');
          const data = await response.json();
          
          if (data.success) {
            operations = data.operations;
            
            // Populate operation select
            operations.forEach(op => {
              const option = document.createElement('option');
              option.value = op.name;
              option.textContent = op.name.charAt(0).toUpperCase() + op.name.slice(1) + ' - ' + op.description;
              operationSelect.appendChild(option);
            });
          }
        } catch (error) {
          console.error('Error fetching operations:', error);
          alert('Failed to fetch available operations');
        }
      }
      
      // Handle operation selection change
      operationSelect.addEventListener('change', function() {
        paramsContainer.innerHTML = '';
        
        const selectedOperation = operations.find(op => op.name === this.value);
        
        if (selectedOperation && selectedOperation.params.length > 0) {
          const paramsTitle = document.createElement('label');
          paramsTitle.className = 'form-label';
          paramsTitle.textContent = 'Parameters';
          paramsContainer.appendChild(paramsTitle);
          
          selectedOperation.params.forEach(param => {
            const formGroup = document.createElement('div');
            formGroup.className = 'mb-2';
            
            const label = document.createElement('label');
            label.className = 'form-label';
            label.htmlFor = `param-${param.name}`;
            label.textContent = `${param.name}${param.required ? ' *' : ''} - ${param.description}`;
            
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'form-control';
            input.id = `param-${param.name}`;
            input.name = param.name;
            input.required = param.required;
            
            formGroup.appendChild(label);
            formGroup.appendChild(input);
            paramsContainer.appendChild(formGroup);
          });
        }
      });
      
      // Handle form submission
      uploadForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const imageFile = document.getElementById('imageInput').files[0];
        const operation = operationSelect.value;
        
        if (!imageFile || !operation) {
          alert('Please select an image and an operation');
          return;
        }
        
        // Get parameters
        const params = new URLSearchParams();
        const selectedOperation = operations.find(op => op.name === operation);
        
        if (selectedOperation) {
          selectedOperation.params.forEach(param => {
            const value = document.getElementById(`param-${param.name}`)?.value;
            if (value) {
              params.append(param.name, value);
            }
          });
        }
        
        // Create form data
        const formData = new FormData();
        formData.append('image', imageFile);
        
        // Set loading state
        uploadForm.classList.add('loading');
        
        // Measure time for benchmark
        const startTime = performance.now();
        
        try {
          // Make API request
          const response = await fetch(`/api/images/${operation}?${params.toString()}`, {
            method: 'POST',
            body: formData
          });
          
          const endTime = performance.now();
          const processingTime = endTime - startTime;
          
          const data = await response.json();
          
          // Remove loading state
          uploadForm.classList.remove('loading');
          
          if (data.success) {
            // Display results
            resultsContainer.style.display = 'block';
            originalImage.src = data.input.url;
            processedImage.src = data.output.url;
            responseJson.textContent = JSON.stringify(data, null, 2);
            
            // Show benchmark
            benchmarkCard.style.display = 'block';
            benchmarkResults.innerHTML = `
              <p><strong>Total Processing Time:</strong> ${processingTime.toFixed(2)} ms</p>
              <p><strong>Operation:</strong> ${operation}</p>
              <p><strong>Image Size:</strong> ${(imageFile.size / 1024).toFixed(2)} KB</p>
            `;
          } else {
            alert(`Error: ${data.message}`);
          }
        } catch (error) {
          // Remove loading state
          uploadForm.classList.remove('loading');
          
          console.error('Error processing image:', error);
          alert('Failed to process image');
        }
      });
      
      // Initialize
      fetchOperations();
    });
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
