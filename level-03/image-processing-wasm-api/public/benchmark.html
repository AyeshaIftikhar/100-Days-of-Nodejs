<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAssembly vs JavaScript Benchmark</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
      margin-top: 30px;
    }
    .spinner-border {
      display: none;
    }
    .loading .spinner-border {
      display: inline-block;
    }
    .results {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">WebAssembly vs JavaScript Benchmark</h1>
    <p class="lead">Compare the performance of WebAssembly and JavaScript for image processing operations</p>
    
    <div class="card">
      <div class="card-header">
        <h5>Upload an Image for Benchmarking</h5>
      </div>
      <div class="card-body">
        <form id="benchmarkForm" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="imageInput" class="form-label">Select Image</label>
            <input class="form-control" type="file" id="imageInput" accept="image/*" required>
          </div>
          
          <div class="mb-3">
            <label for="iterationsInput" class="form-label">Number of Iterations</label>
            <input type="number" class="form-control" id="iterationsInput" min="1" max="20" value="5">
            <div class="form-text">More iterations provide more accurate results but take longer to run</div>
          </div>
          
          <button type="submit" class="btn btn-primary">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Run Benchmark
          </button>
        </form>
      </div>
    </div>
    
    <div class="results" id="resultsContainer" style="display: none;">
      <h3>Benchmark Results</h3>
      
      <div class="row">
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-header">Image Information</div>
            <div class="card-body">
              <ul class="list-group list-group-flush" id="imageInfo">
                <!-- Image info will be inserted here -->
              </ul>
            </div>
          </div>
        </div>
        
        <div class="col-md-6">
          <div class="card mb-4">
            <div class="card-header">Performance Summary</div>
            <div class="card-body">
              <div id="performanceSummary">
                <!-- Performance summary will be inserted here -->
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="chart-container">
        <canvas id="benchmarkChart"></canvas>
      </div>
      
      <div class="card mt-4">
        <div class="card-header">
          <h5>Raw Data</h5>
        </div>
        <div class="card-body">
          <pre id="rawData" class="bg-light p-3 rounded" style="max-height: 300px; overflow: auto;"></pre>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const benchmarkForm = document.getElementById('benchmarkForm');
      const resultsContainer = document.getElementById('resultsContainer');
      const imageInfo = document.getElementById('imageInfo');
      const performanceSummary = document.getElementById('performanceSummary');
      const rawData = document.getElementById('rawData');
      let benchmarkChart = null;
      
      benchmarkForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const imageFile = document.getElementById('imageInput').files[0];
        const iterations = document.getElementById('iterationsInput').value;
        
        if (!imageFile) {
          alert('Please select an image file');
          return;
        }
        
        // Create form data
        const formData = new FormData();
        formData.append('image', imageFile);
        
        // Set loading state
        benchmarkForm.classList.add('loading');
        resultsContainer.style.display = 'none';
        
        try {
          const response = await fetch(`/api/benchmark?iterations=${iterations}`, {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          // Remove loading state
          benchmarkForm.classList.remove('loading');
          
          if (data.success) {
            // Display results
            displayResults(data.benchmarkResults);
            resultsContainer.style.display = 'block';
          } else {
            alert(`Error: ${data.message}`);
          }
        } catch (error) {
          // Remove loading state
          benchmarkForm.classList.remove('loading');
          
          console.error('Error running benchmark:', error);
          alert('Failed to run benchmark');
        }
      });
      
      function displayResults(results) {
        // Display image info
        imageInfo.innerHTML = `
          <li class="list-group-item">Width: ${results.image.width}px</li>
          <li class="list-group-item">Height: ${results.image.height}px</li>
          <li class="list-group-item">Channels: ${results.image.channels}</li>
          <li class="list-group-item">Size: ${(results.image.size / 1024).toFixed(2)} KB</li>
        `;
        
        // Display performance summary
        let summaryHTML = '<ul class="list-group list-group-flush">';
        
        for (const [operation, data] of Object.entries(results.operations)) {
          const jsAvg = data.js.average.toFixed(2);
          const wasmAvg = data.wasm?.average ? data.wasm.average.toFixed(2) : 'N/A';
          const improvement = data.improvement || 'N/A';
          
          summaryHTML += `
            <li class="list-group-item">
              <strong>${formatOperationName(operation)}:</strong>
              <br>JS: ${jsAvg} ms | WASM: ${wasmAvg} ms
              <br>Improvement: ${improvement}
            </li>
          `;
        }
        
        summaryHTML += '</ul>';
        performanceSummary.innerHTML = summaryHTML;
        
        // Display raw data
        rawData.textContent = JSON.stringify(results, null, 2);
        
        // Create chart
        createChart(results);
      }
      
      function createChart(results) {
        const ctx = document.getElementById('benchmarkChart').getContext('2d');
        
        // Destroy existing chart if it exists
        if (benchmarkChart) {
          benchmarkChart.destroy();
        }
        
        const labels = Object.keys(results.operations).map(formatOperationName);
        const jsData = Object.values(results.operations).map(op => op.js.average);
        const wasmData = Object.values(results.operations).map(op => op.wasm?.average || 0);
        
        benchmarkChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'JavaScript (ms)',
                data: jsData,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
              },
              {
                label: 'WebAssembly (ms)',
                data: wasmData,
                backgroundColor: 'rgba(255, 99, 132, 0.7)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: 'Processing Time (ms)'
                }
              }
            },
            plugins: {
              title: {
                display: true,
                text: 'WebAssembly vs JavaScript Performance Comparison'
              },
              tooltip: {
                callbacks: {
                  afterBody: function(tooltipItems) {
                    const index = tooltipItems[0].dataIndex;
                    const operation = Object.keys(results.operations)[index];
                    const improvement = results.operations[operation].improvement;
                    
                    if (improvement) {
                      return `Performance Improvement: ${improvement}`;
                    }
                    return '';
                  }
                }
              }
            }
          }
        });
      }
      
      function formatOperationName(operation) {
        return operation.split('-')
          .map(word => word.charAt(0).toUpperCase() + word.slice(1))
          .join(' ');
      }
    });
  </script>
</body>
</html>
