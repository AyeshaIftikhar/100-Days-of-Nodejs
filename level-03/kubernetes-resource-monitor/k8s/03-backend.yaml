# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: resource-monitor
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: resource-monitor-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: PORT
        - name: MONGODB_URI
          value: "mongodb://admin:$(MONGODB_PASSWORD)@mongodb-service:27017/resource_monitor?authSource=admin"
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: resource-monitor-secrets
              key: MONGODB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: resource-monitor-secrets
              key: REDIS_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: resource-monitor-secrets
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: resource-monitor-secrets
              key: JWT_REFRESH_SECRET
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: CORS_ORIGIN
        - name: METRICS_COLLECTION_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: METRICS_COLLECTION_INTERVAL
        - name: ALERT_THRESHOLD_CPU
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: ALERT_THRESHOLD_CPU
        - name: ALERT_THRESHOLD_MEMORY
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: ALERT_THRESHOLD_MEMORY
        - name: ALERT_THRESHOLD_DISK
          valueFrom:
            configMapKeyRef:
              name: resource-monitor-config
              key: ALERT_THRESHOLD_DISK
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: logs-volume
        emptyDir: {}
      restartPolicy: Always
---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: resource-monitor
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP
