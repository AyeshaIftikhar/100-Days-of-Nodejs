version: "3.8"
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - DATA_GENERATOR_INTERVAL_MS=1000
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
