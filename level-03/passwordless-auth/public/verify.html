<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 16px}
    .ok{color:#065f46}
    .err{color:#991b1b}
  </style>
</head>
<body>
  <h1>Verification</h1>
  <div id="status"></div>
  <p><a href="/">Return to the app</a></p>
<script>
  const params = new URLSearchParams(location.search);
  const status = document.getElementById('status');
  if (params.get('success')) {
    const email = params.get('email');
    status.innerHTML = `<p class="ok">You're signed in${email? ' as <b>'+email+'</b>':''}. You can close this tab and return to the app.</p>`;
  } else {
    status.innerHTML = `<p class="err">${params.get('error') || 'Verification failed'}</p>`;
  }
</script>
</body>
</html>
