version: '3.8'

services:
  app:
    build:
      context: .
      target: builder
    image: stock-price-fetcher
    container_name: stock-app
    restart: unless-stopped
    ports:
      - "${PORT}:3000"
    environment:
      - NODE_ENV=production
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - stock-network

  redis:
    image: redis:7-alpine
    container_name: stock-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  redis_data: