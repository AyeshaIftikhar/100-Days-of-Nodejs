<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.0/styles/github.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      color: #333;
    }
    pre {
      background: #f8f8f8;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
    }
    code {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
    }
    h1, h2, h3 {
      color: #2c3e50;
    }
    a {
      color: #3498db;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    {{#metadata.date}}
      <p class="date">Last updated: {{metadata.date}}</p>
    {{/metadata.date}}
  </header>
  
  <main>
    {{content}}
  </main>
  
  <footer>
    <p>Generated by Markdown to HTML Converter</p>
  </footer>
</body>
</html>
